<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPYBIRTHDAY</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <h1>Answer the question</h1>
        <div class="login-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Whose birthday?" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="What's the date today?" required>
            </div>
            <button id="login-btn">Let's go to the party!</button>
            <p id="error-message"></p>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
