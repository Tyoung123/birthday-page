<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday！</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="birthday-body">
    <div class="birthday-container">
        <h1 id="greeting">生日快乐！</h1>
        <div class="cake-container">
            <img src="../assets/img/cake.png" alt="生日蛋糕" class="cake-image">
        </div>
        <button id="play-music">Let's Go👀</button>
        <div class="message-container" id="message-container" style="display: none;">
            <p id="birthday-message">Another year older, hope life treats you well! Amin...</p>
            <div class="extended-wishes">
                <p>May Mr.Trouble stay far away from you!</p>
                <p>May you graduate smoothly at an early date!</p>
                <p>May every step you walk toward all that you love, Amin</p>
                <p class="signature">——Tang Yang</p>
            </div>
        </div>
    </div>
    <audio id="birthday-song" src="../assets/happy-birthday.mp3" preload="auto" autoplay></audio>
    <div class="balloons">
        <div class="balloon balloon-1"></div>
        <div class="balloon balloon-2"></div>
        <div class="balloon balloon-3"></div>
        <div class="balloon balloon-4"></div>
        <div class="balloon balloon-5"></div>
    </div>
    <div class="confetti-container"></div>
    <script src="../js/birthday.js"></script>
</body>
</html>
